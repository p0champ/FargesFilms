<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rooms to watch films in, for Meta Quest.">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141518'/%3E%3Crect x='7' y='9' width='18' height='12' rx='2.5' fill='%23f2efe8'/%3E%3Crect x='12' y='23' width='8' height='2' rx='1' fill='%23f2efe8'/%3E%3C/svg%3E">
  <title>Farges Films</title>
  <style>
    @font-face { font-family: Inter; src: url('./fonts/Inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    :root { --ink: #f2efe8; --dim: rgba(242, 239, 232, 0.7); --font: Inter, system-ui, -apple-system, sans-serif; }
    html, body { margin: 0; height: 100%; background: #0b0b0c; color: var(--ink); font-family: var(--font); overflow: hidden; }
    #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #card {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
      width: min(440px, calc(100vw - 48px)); box-sizing: border-box; padding: 28px 32px 24px; text-align: center;
      background: rgba(28, 29, 33, 0.72); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 28px;
      -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
    }
    #card small { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
    h1 { margin: 8px 0 8px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: var(--dim); }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    button {
      font: 600 16px var(--font); color: var(--ink); cursor: pointer; border: 0; border-radius: 999px;
      padding: 14px 28px; background: rgba(255, 255, 255, 0.1); transition: background 0.12s ease-out, transform 0.08s ease-out;
    }
    button:hover { background: rgba(255, 255, 255, 0.2); }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary { background: var(--ink); color: #141518; min-width: 220px; padding: 16px 28px; font-size: 17px; }
    button.primary:hover { background: #ffffff; }
    button.quiet { font-size: 14px; padding: 10px 20px; }
    #status { margin: 16px 0 0; min-height: 20px; font-size: 13px; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="stage" role="img" aria-label="Preview of the room. Drag, or use the arrow keys, to look around."></div>
  <main id="card">
    <small>Farges Films</small>
    <h1 id="room-name">&nbsp;</h1>
    <p>Take a seat in the room. Point and pull the trigger to choose what to watch.</p>
    <div class="actions">
      <button id="enter" class="primary" hidden disabled>Enter Room</button>
      <button id="retry" class="primary" hidden>Try again</button>
      <button id="lights" class="quiet" title="Shortcut: L">Dim the lights</button>
    </div>
    <p id="status" aria-live="polite">Loading…</p>
  </main>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="./main.js"></script>
</body>
</html>
